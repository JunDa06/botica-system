<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario - Botica</title>

  <link rel="stylesheet" href="css/styles.css">

  <!-- 🔐 PROTECCIÓN -->
  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "login.html";
    }
  </script>
</head>
<body>

  <div class="navbar">
    <span class="logo">💊 Botica</span>

    <a href="index.html">Inicio</a>
    <a href="inventario.html" class="active">Inventario</a>
    <a href="ventas.html">Ventas</a>
    <a href="agotados.html">Agotados</a>
    <a href="historial.html">Historial</a> 

    <div class="spacer"></div>

    <button onclick="logout()">Cerrar sesión</button>
  </div>

  <!-- 📦 CONTENIDO -->
  <div class="container">

    <h1>Inventario</h1>

    <!-- 🟢 FORMULARIO -->
    <div class="card">
      <h2>Agregar producto</h2>

      <div class="form-row">
        <input id="nombre" placeholder="Nombre">
        <input id="precio" type="number" step="0.01" placeholder="Precio">
        <input id="stock" type="number" placeholder="Stock">

        <button class="btn" onclick="crearProducto()">Crear</button>
      </div>
    </div>

    <!-- 🟢 LISTA -->
    <div class="card">
      <h2>Lista de productos</h2>

      <input 
        id="buscador" 
        placeholder="Buscar producto..." 
        oninput="filtrarProductos()"
      >

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 🔓 LOGOUT -->
  <script>
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }
  </script>

  <!-- JS -->
  <script src="js/app.js"></script>

</body>
</html>
