<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial de Ventas - Botica</title>

  <link rel="stylesheet" href="css/styles.css">

  <!-- 🔐 PROTECCIÓN -->
  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "login.html";
    }
  </script>
</head>
<body>

  <div class="navbar">
    <span class="logo">💊 Botica</span>

    <a href="index.html">Inicio</a>
    <a href="inventario.html">Inventario</a>
    <a href="ventas.html">Ventas</a>
    <a href="agotados.html">Agotados</a>
    <a href="historial.html" class="active">Historial</a>

    <div class="spacer"></div>

    <button onclick="logout()">Cerrar sesión</button>
  </div>

  <!-- 📦 CONTENIDO -->
  <div class="container">

    <h1>📊 Historial de Ventas</h1>

    <div class="card">
      <h2>Lista de boletas</h2>

      <!-- 🔍 BUSCADOR -->
      <input 
        id="buscadorHistorial" 
        placeholder="Buscar por cliente..." 
        oninput="filtrarHistorial()"
      >

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Total</th>
              <th>Fecha</th>
              <th>Detalle</th>
            </tr>
          </thead>
          <tbody id="tablaHistorial"></tbody>
        </table>
      </div>
    </div>

    <!-- 📦 DETALLE -->
    <div class="card">
      <h2>Detalle de la boleta</h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Precio</th>
            </tr>
          </thead>
          <tbody id="detalleBoleta"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 🔓 LOGOUT -->
  <script>
    function logout() {
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }
  </script>

  <!-- JS -->
  <script src="js/historial.js"></script>

</body>
</html>
